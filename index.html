<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربح تراكمي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
        }

        main {
            max-width: 900px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h2>ربح تراكمي</h2>

    <select id="language">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
    </select>
</header>

<main>
    <h1 id="welcome">مرحبًا بكم في موقع ربح تراكمي</h1>
</main>

<footer>
    © 2026 ربح تراكمي
</footer>

<script>
const translations = {
    ar: {
        welcome: "مرحبًا بكم في موقع ربح تراكمي",
        direction: "rtl"
    },
    en: {
        welcome: "Welcome to the cumulative profit site",
        direction: "ltr"
    },
    fr: {
        welcome: "Bienvenue sur le site des profits cumulatifs",
        direction: "ltr"
    }
};

document.getElementById("language").addEventListener("change", function () {
    const language = this.value;

    document.getElementById("welcome").textContent =
        translations[language].welcome;

    document.documentElement.lang = language;
    document.documentElement.dir =
        translations[language].direction;
});
</script>

</body>
</html>
